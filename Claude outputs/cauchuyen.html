*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#000;color:#fff;overflow:hidden;-webkit-font-smoothing:antialiased;font-family:var(--f-title)}
a{color:inherit}

/* ---------- thanh trên: giống cuon.html ---------- */
header{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;justify-content:space-between;align-items:center;height:84px;padding:26px 30px;pointer-events:none}
header .brand{font-family:var(--serif);font-size:24px;letter-spacing:-.01em;pointer-events:auto}
header .brand-sub{margin-left:.1em}
header .menu{font-family:var(--f-title);font-size:19px;line-height:1;pointer-events:auto;cursor:pointer}
/* ---------- menu sổ xuống (dùng chung 3 trang) ---------- */
.menu-wrap{position:relative;pointer-events:auto}
header .menu{background:none;border:0;color:#fff;padding:0;display:block;overflow:hidden;height:1.15em}
header .menu .mt{display:block;transition:transform .45s cubic-bezier(.75,0,0,1)}
header .menu .mt span{display:block;line-height:1.15em;text-align:right}
.menu-wrap.open .menu .mt{transform:translateY(-1.15em)}
.dd{position:absolute;right:-12px;top:calc(100% + 16px);min-width:260px;padding:14px 22px 16px;
  background:transparent;
  clip-path:inset(0 0 100% 0);transition:clip-path .6s cubic-bezier(.75,0,0,1);pointer-events:none}
.menu-wrap.open .dd{clip-path:inset(0 0 0 0);pointer-events:auto}
.dd a{display:block;overflow:hidden;padding:9px 0;color:#fff;text-decoration:none;font-family:var(--f-title)}
.dd .row{display:flex;align-items:baseline;gap:14px;transform:translateY(115%);
  transition:transform .5s cubic-bezier(.215,.61,.355,1)}
.menu-wrap.open .dd .row{transform:none}
.menu-wrap.open .dd a:nth-child(1) .row{transition-delay:.18s}
.menu-wrap.open .dd a:nth-child(2) .row{transition-delay:.26s}
.dd .n{font-size:12px;letter-spacing:.08em}
.dd .t{font-size:22px;line-height:1.2;transition:transform .35s cubic-bezier(.215,.61,.355,1)}
.dd a:hover .t{transform:translateX(6px)}
.dd .cur{margin-left:auto;font-size:14px}

/* ---------- sân khấu ---------- */
.stage{position:fixed;inset:0;z-index:5;clip-path:polygon(0% 0%,100% 0%,100% 100%,0% 100%)}
html.from-main .stage,html.from-cuon .stage{clip-path:polygon(50% 0%,50% 0%,50% 100%,50% 100%)}
.ch{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:6vw;padding:110px 8vw 110px;visibility:hidden}
.ch.on{visibility:visible}
.ch.flip .txt{order:2}
.ch.flip .frame{order:1}

/* dòng chữ trượt qua khe */
.slit{display:block;overflow:hidden;padding:.12em 0;margin:-.12em 0}
.slit > span{display:block;will-change:transform}

.lbl{font-family:var(--f-track);text-transform:uppercase;letter-spacing:.1em;font-size:13px}
.ttl{font-weight:400;font-size:clamp(40px,5.2vw,84px);line-height:1.06;letter-spacing:-.005em;margin-top:22px}
.body{font-size:clamp(16px,1.25vw,19px);line-height:1.6;max-width:30em;margin-top:28px}
.orn{display:block;width:72px;aspect-ratio:1000/136;background:var(--logo-white) center/contain no-repeat;margin-top:30px}

/* khung ảnh kiểu khung ngắm máy quay, chờ chèn ảnh */
.frame{position:relative;width:100%;max-width:560px;justify-self:center;aspect-ratio:4/5;background:#0b0b0b;overflow:hidden;
  clip-path:inset(0 0 0 0)}
.frame.wide{aspect-ratio:16/10;max-width:680px}
.frame img,.frame video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.frame .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;
  border:1px dashed rgba(255,255,255,.18)}
.frame .ph b{font-family:var(--f-track);font-weight:400;letter-spacing:.12em;font-size:13px}
.frame .ph i{font-style:normal;font-size:14px;opacity:.55}
.frame .cn{position:absolute;width:16px;height:16px;border-color:rgba(255,255,255,.7);border-style:solid;z-index:2}
.frame .cn.tl{top:12px;left:12px;border-width:1px 0 0 1px}
.frame .cn.tr{top:12px;right:12px;border-width:1px 1px 0 0}
.frame .cn.bl{bottom:12px;left:12px;border-width:0 0 1px 1px}
.frame .cn.br{bottom:12px;right:12px;border-width:0 1px 1px 0}

/* chương mở đầu: căn giữa */
.ch.intro{grid-template-columns:1fr;justify-items:center;text-align:center}
.ch.intro .ttl{font-size:clamp(96px,17vw,280px);line-height:.95;color:var(--red);margin-top:18px}
.ch.intro .hvl{display:block;width:clamp(240px,34vw,560px);height:auto;margin:0 auto}
@media (max-width:760px){ .ch.intro .hvl{width:72vw} }
.ch.intro .body{margin:26px auto 0}
.ch.intro .orn{margin:30px auto 0}
/* chương cuối */
.ch.outro{grid-template-columns:1fr;justify-items:center;text-align:center}
.ch.outro .body{margin:26px auto 0}
.ch.outro .orn{margin:30px auto 0}

/* dải ảnh hậu trường */
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;width:100%}
.strip .frame{aspect-ratio:3/4;max-width:none}

/* góc dưới */
.foot{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-between;align-items:flex-end;padding:0 30px 26px;pointer-events:none}
.skip{pointer-events:auto;font-size:15px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.count{font-family:var(--f-track);letter-spacing:.1em;font-size:13px;display:flex;gap:.5em;align-items:center}
.count .cur{display:inline-block;overflow:hidden;height:1.2em;line-height:1.2em}
.count .cur span{display:block}
.bar{position:fixed;left:30px;right:30px;bottom:14px;height:1px;background:rgba(255,255,255,.12);z-index:20}
.bar i{position:absolute;left:0;top:0;height:100%;width:0;background:#fff;transition:width .8s cubic-bezier(.75,0,0,1)}
html.from-main header,html.from-main .foot,html.from-main .bar,
html.from-cuon header,html.from-cuon .foot,html.from-cuon .bar{opacity:0}

@media (max-width:760px){
  header{padding:20px 16px;height:72px}
  header .brand{font-size:20px}
  .ch{grid-template-columns:1fr;gap:26px;padding:86px 16px 90px;align-content:center}
  .ch.flip .txt{order:2}.ch.flip .frame{order:1}
  .ch .frame{order:1;max-width:none;aspect-ratio:16/10;max-height:36vh}
  .ch .txt{order:2}
  .strip{grid-template-columns:repeat(3,1fr);gap:8px}
  .strip .frame{aspect-ratio:3/4;max-height:none}
  .foot{padding:0 16px 22px}
  .bar{left:16px;right:16px}
}
@media (prefers-reduced-motion:reduce){ .bar i{transition:none} }
</style>
</head>

<header>
  <div class="brand">MCK <span class="brand-sub">• HVL Album</span></div>

const CHAPTERS = [
  { type:'intro', label:'02. Câu chuyện album', title:['<img class="hvl" src="'+HVL_IMG+'" alt="HVL">'],
    body:'Cuộn xuống để bắt đầu.' },
  { label:'Chương I', title:['Ba mươi bài hát,','một câu chuyện.'],
    body:'Từ “Elegie” mở màn đến “Thịt” khép lại, HVL đi qua ba mươi khoảnh khắc: có lúc ồn ào, có lúc lặng im.',
    img:'', video:'', frameNo:'01', wide:false },
  { label:'Chương II', title:['Những người','đi cùng.'], flip:true,
    body:'marzuz, Tage, A$AP Ướt Mi, Tùng Dương, Obito, THANHDRAW và RPT ORIJINN góp giọng trên những trang khác nhau của album.',
    img:'', video:'', frameNo:'02', wide:true },
  { label:'Chương III', title:['Phía sau','ống kính.'], type:'strip',
    body:'Những khoảnh khắc từ phòng thu và buổi chụp hình.',
    imgs:['','',''] },
  { label:'Chương IV', title:['Nghe theo','cách của bạn.'],
    body:'Ba mươi track, đánh số từ 01 đến 30. Nghe theo thứ tự, hoặc chọn bất kỳ bài nào ở trang tiếp theo.',
    img:'', video:'', frameNo:'06', wide:false },
  { type:'outro', label:'03. Khám phá album', title:['Giờ thì','nghe thôi.'],
    body:'Cuộn xuống để vào album.' },
];

/* ---------- dựng các chương ---------- */
const stage = document.getElementById('stage');
const frameHTML = (src, video, no, wide) => `
  <div class="frame${wide?' wide':''}">
    <span class="cn tl"></span><span class="cn tr"></span><span class="cn bl"></span><span class="cn br"></span>
    ${video ? `<video src="${encodeURI(video)}" autoplay muted loop playsinline></video>`
      : src ? `<img src="${encodeURI(src)}" alt="">`
      : `<div class="ph"><b>Ảnh ${no}</b><i>Chèn ảnh tại đây</i></div>`}
  </div>`;
const lines = arr => arr.map(t=>`<span class="slit"><span>${t}</span></span>`).join('');
CHAPTERS.forEach((c,i)=>{
  const el = document.createElement('section');
  el.className = 'ch' + (c.type==='intro'?' intro':'') + (c.type==='outro'?' outro':'') + (c.flip?' flip':'');
  const txt = `<div class="txt">
      <div class="lbl slit"><span>${c.label}</span></div>
      <h2 class="ttl">${lines(c.title)}</h2>
      ${c.body ? `<p class="body slit"><span>${c.body}</span></p>` : ''}
      ${(c.type==='intro'||c.type==='outro') ? '<span class="orn"></span>' : ''}
    </div>`;
  let media = '';
  if (c.type==='strip') media = `<div class="strip">${c.imgs.map((s,k)=>frameHTML(s,'',String(k+3).padStart(2,'0'),false)).join('')}</div>`;
  else if (c.type!=='intro' && c.type!=='outro') media = frameHTML(c.img, c.video, c.frameNo, c.wide);
  if (c.type==='strip'){ el.style.gridTemplateColumns = '1fr 1.4fr'; }
  el.innerHTML = txt + media;
  stage.appendChild(el);
});
const secs = [...stage.children];
document.getElementById('totNo').textContent = String(secs.length).padStart(2,'0');

/* ---------- chuyển chương kiểu jasonbergh ---------- */
const EASE_IN = 'cubic-bezier(.55,0,.8,.2)', EASE_OUT = 'cubic-bezier(.215,.61,.355,1)', EASE_CUT = 'cubic-bezier(.75,0,0,1)';
const FULL = 'polygon(0% 0%,100% 0%,100% 100%,0% 100%)', LINE = 'polygon(50% 0%,50% 0%,50% 100%,50% 100%)';
const movers = sec => [...sec.querySelectorAll('.slit > span, .orn')];
const frames = sec => [...sec.querySelectorAll('.frame')];
function stop(el){ el.getAnimations().forEach(a=>{ try{a.commitStyles();}catch(e){} a.cancel(); }); }

function animOut(sec, dir){
  movers(sec).forEach((el,k)=>{ stop(el); el.animate([{transform:'translateY(0%)',opacity:1},{transform:`translateY(${-dir*110}%)`,opacity: el.classList.contains('orn')?0:1}],
    {duration:380, delay:k*45, easing:EASE_IN, fill:'forwards'}); });
  frames(sec).forEach((f,k)=>{ stop(f); f.animate([{clipPath:'inset(0 0 0 0)'},{clipPath: dir>0 ? 'inset(0 0 100% 0)' : 'inset(100% 0 0 0)'}],
    {duration:650, delay:k*70, easing:EASE_CUT, fill:'forwards'}); });
}
function animIn(sec, dir, extra=0){
  movers(sec).forEach((el,k)=>{ stop(el); el.animate([{transform:`translateY(${dir*110}%)`,opacity: el.classList.contains('orn')?0:1},{transform:'translateY(0%)',opacity:1}],
    {duration:560, delay:extra + 120 + k*80, easing:EASE_OUT, fill:'backwards'}); });
  frames(sec).forEach((f,k)=>{ stop(f); f.animate([{clipPath: dir>0 ? 'inset(100% 0 0 0)' : 'inset(0 0 100% 0)'},{clipPath:'inset(0 0 0 0)'}],
    {duration:900, delay:extra + k*90, easing:EASE_CUT, fill:'backwards'}); });
}

let cur = -1, busy = false, pending = 0, leaving = false;
const curNo = document.getElementById('curNo'), bar = document.getElementById('bar');
function setCount(i, dir){
  const t = String(i+1).padStart(2,'0');
  curNo.animate([{transform:'translateY(0)'},{transform:`translateY(${-dir*100}%)`}],{duration:220,easing:EASE_IN}).onfinish = ()=>{
    curNo.textContent = t;
    curNo.animate([{transform:`translateY(${dir*100}%)`},{transform:'translateY(0)'}],{duration:320,easing:EASE_OUT});
  };
  bar.style.width = ((i+1)/secs.length*100) + '%';
}
function show(i, dir, extra=0){
  const prev = cur; cur = i; busy = true;
  if (prev >= 0){
    animOut(secs[prev], dir);
    setTimeout(()=>{ secs[prev].classList.remove('on'); }, 700);
  }
  const wait = prev >= 0 ? 380 : 0;
  setTimeout(()=>{ secs[i].classList.add('on'); animIn(secs[i], dir, extra); }, wait);
  setCount(i, dir);
  setTimeout(()=>{ busy = false; if (pending){ const d = pending; pending = 0; step(d); } }, wait + 620);
}
function step(dir){
  if (leaving) return;
  if (busy){ pending = dir; return; }
  const n = cur + dir;
  if (n < 0) return leave('main1.html#from-cuon', -1);
  if (n >= secs.length) return leave('cuon.html#from-main', 1);
  show(n, dir);
}

/* ---------- rời trang: chữ trượt đi, khung khép vào vạch giữa ---------- */
function leave(url, dir){
  if (leaving) return; leaving = true;
  if (cur >= 0) animOut(secs[cur], dir);
  ['header','.foot','.bar'].forEach(q=>document.querySelector(q).animate([{opacity:1},{opacity:0}],{duration:400,fill:'forwards'}));
  stage.animate([{clipPath:FULL},{clipPath:LINE}],{duration:700,delay:220,easing:EASE_CUT,fill:'forwards'});
  setTimeout(()=>{ location.href = url; }, 1000);
}

/* ---------- điều khiển: lăn chuột, phím, vuốt ---------- */
let lastWheel = 0;
addEventListener('wheel', e=>{
  e.preventDefault();
  if (window.MENU_OPEN || Math.abs(e.deltaY) < 2) return;
  const now = performance.now(); const fresh = now - lastWheel > 160; lastWheel = now;
  if (fresh) step(e.deltaY > 0 ? 1 : -1);
}, {passive:false});
addEventListener('keydown', e=>{
  if (window.MENU_OPEN) return;
  if (['ArrowDown','PageDown',' '].includes(e.key)){ e.preventDefault(); step(1); }
  if (['ArrowUp','PageUp'].includes(e.key)){ e.preventDefault(); step(-1); }
});
let ty0 = null;
addEventListener('touchstart', e=>{ ty0 = e.touches[0].clientY; }, {passive:true});
addEventListener('touchend', e=>{
  if (ty0 === null || window.MENU_OPEN) return;
  const dy = ty0 - e.changedTouches[0].clientY; ty0 = null;
  if (Math.abs(dy) > 50) step(dy > 0 ? 1 : -1);
}, {passive:true});
document.getElementById('skip').addEventListener('click', e=>{ e.preventDefault(); leave('cuon.html#from-main', 1); });

/* ---------- vào trang ---------- */
const root = document.documentElement;
const fromMain = root.classList.contains('from-main'), fromCuon = root.classList.contains('from-cuon');
if (fromMain || fromCuon){
  history.replaceState(null, '', location.pathname);
  requestAnimationFrame(()=>{
    root.classList.remove('from-main','from-cuon');
    stage.animate([{clipPath:LINE},{clipPath:FULL}],{duration:900,delay:100,easing:EASE_CUT,fill:'backwards'});
    ['header','.foot','.bar'].forEach((q,k)=>document.querySelector(q).animate([{opacity:0},{opacity:1}],{duration:600,delay:700+k*80,fill:'backwards'}));
  });
}
(document.fonts ? document.fonts.ready : Promise.resolve()).then(()=>{
  if (fromCuon) show(secs.length-1, -1, 550);
  else show(0, 1, fromMain ? 550 : 200);
});
/* ---------- menu sổ xuống ---------- */
const menuWrap = document.getElementById('menuWrap'), menuBtn = document.getElementById('menuBtn');
window.MENU_OPEN = false;
function setMenu(open){
  window.MENU_OPEN = open;
  menuWrap.classList.toggle('open', open);
  menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
}
menuBtn.addEventListener('click', e=>{ e.stopPropagation(); setMenu(!window.MENU_OPEN); });
document.addEventListener('click', e=>{ if (window.MENU_OPEN && !menuWrap.contains(e.target)) setMenu(false); });
document.addEventListener('keydown', e=>{ if (e.key === 'Escape' && window.MENU_OPEN) setMenu(false); }, true);
const MENU_GO = {main: ()=>leave('main1.html#from-cuon', -1), cuon: ()=>leave('cuon.html#from-main', 1)};
menuWrap.querySelectorAll('.dd a').forEach(a=>{
  a.addEventListener('click', e=>{
    e.preventDefault();
    const page = a.dataset.page;
    setMenu(false);
    if (page === 'story') return;           // đang ở trang này rồi
    setTimeout(()=>{ MENU_GO[page](); }, 350);   // đóng menu xong mới chạy hiệu ứng chuyển trang
  });
});
</script>
